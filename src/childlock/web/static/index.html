<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>전자식 차일드락 시뮬레이터</title>
<style>
  :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
  body { max-width: 960px; margin: 1rem auto; padding: 0 1rem; }
  fieldset { margin: 0 0 1rem; }
  label { display: inline-block; margin: .2rem .8rem .2rem 0; }
  .out { display: flex; gap: 1rem; margin: .5rem 0 1rem; }
  .door { flex: 1; padding: 1rem; border: 2px solid; border-radius: 8px; text-align: center; font-size: 1.4rem; }
  .LOCK { border-color: #c0392b; } .RELEASE { border-color: #27ae60; }
  table { border-collapse: collapse; width: 100%; font-size: .85rem; }
  td, th { border: 1px solid #8884; padding: .2rem .4rem; text-align: left; }
  #msg { color: #c0392b; min-height: 1.4em; }
</style>
</head>
<body>
<h1>전자식 차일드락 시뮬레이터</h1>

<fieldset>
  <legend>차량 입력</legend>
  <label>차속(km/h) <input id="speed" type="number" step="0.1" value="0"></label>
  <label>기어 <select id="gear"><option>P</option><option>N</option><option>D</option><option>R</option></select></label>
  <label>충돌 <select id="crash"><option>NONE</option><option>PENDING</option><option>CONFIRMED</option></select></label>
  <label>입력 경과(ms) <input id="age" type="number" value="0" min="0"></label><br>
  <label><input id="rear_left_approach_risk" type="checkbox"> 좌 접근위험</label>
  <label><input id="rear_right_approach_risk" type="checkbox"> 우 접근위험</label>
  <label><input id="fire_detected" type="checkbox"> 화재</label>
  <label><input id="overtemperature_detected" type="checkbox"> 과온</label>
  <label><input id="adult_present" type="checkbox"> 성인 탑승</label>
  <label><input id="isofix_left" type="checkbox"> 좌 ISOFIX</label>
  <label><input id="isofix_right" type="checkbox"> 우 ISOFIX</label>
  <label><input id="ignition_on" type="checkbox" checked> 시동 ON</label>
  <label><input id="sensor_fault" type="checkbox"> 센서 고장</label>
</fieldset>

<fieldset>
  <legend>운전자 명령</legend>
  <label>대상 <select id="side"><option value="">(없음)</option><option>left</option><option>right</option><option>all</option></select></label>
  <label>동작 <select id="action"><option>lock</option><option>unlock</option></select></label>
  <label>경로 <select id="source"><option>physical_button</option><option>avn</option><option>voice</option><option>mobile_app</option></select></label>
</fieldset>

<p><button id="send">평가 (50 ms 주기 1회)</button> <button id="tick">입력 없이 시간만 경과 (+50 ms)</button></p>
<div id="msg" role="alert"></div>

<h2>상태</h2>
<div class="out">
  <div id="left" class="door">좌: -</div>
  <div id="right" class="door">우: -</div>
</div>
<p>상태 <b id="state">-</b> · 이유코드 <b id="reason">-</b> · override <b id="override">-</b></p>
<p>입력 유효성 <code id="validity">-</code></p>

<h2>최근 이벤트 (최대 100건)</h2>
<table>
  <thead><tr><th>ID</th><th>시각(s)</th><th>상태</th><th>좌</th><th>우</th><th>이유코드</th></tr></thead>
  <tbody id="events"></tbody>
</table>

<script>
const BOOLS = ["rear_left_approach_risk", "rear_right_approach_risk", "fire_detected",
  "overtemperature_detected", "adult_present", "isofix_left", "isofix_right",
  "ignition_on", "sensor_fault"];
const $ = (id) => document.getElementById(id);
let clock = 1.0;  // 시뮬레이터 시계(초)

function snapshot() {
  const age = Number($("age").value) / 1000;
  const snap = {
    timestamp_s: clock, source_timestamp_s: clock - age,
    vehicle_speed_kph: Number($("speed").value),
    gear: $("gear").value, crash_status: $("crash").value,
  };
  for (const key of BOOLS) snap[key] = $(key).checked;
  return snap;
}

function command() {
  if (!$("side").value) return null;
  return { side: $("side").value, action: $("action").value, source: $("source").value };
}

async function post(path, body) {
  const response = await fetch(path, {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
  });
  const data = await response.json();
  $("msg").textContent = response.ok ? "" : (data.errors || [data.error || "오류"]).join(" / ");
  await refresh();
}

function door(el, name, value) {
  el.textContent = `${name}: ${value}`;
  el.className = `door ${value}`;
}

async function refresh() {
  const status = await (await fetch("/status")).json();
  door($("left"), "좌", status.lock_left);
  door($("right"), "우", status.lock_right);
  $("state").textContent = status.state;
  $("reason").textContent = status.reason_code;
  $("override").textContent = status.override ? "예" : "아니오";
  $("validity").textContent = JSON.stringify(status.input_validity);
  const events = await (await fetch("/events")).json();
  $("events").innerHTML = "";
  for (const e of events.slice(-20).reverse()) {
    const row = $("events").insertRow();
    for (const v of [e.event_id, e.timestamp_s.toFixed(3), e.state, e.lock_left, e.lock_right, e.reason_code])
      row.insertCell().textContent = v;
  }
}

$("send").onclick = () => { clock += 0.05; post("/evaluate", { snapshot: snapshot(), command: command() }); };
$("tick").onclick = () => { clock += 0.05; post("/tick", { timestamp_s: clock }); };
refresh();
</script>
</body>
</html>
